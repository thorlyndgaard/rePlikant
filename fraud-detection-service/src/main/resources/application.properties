spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=fraud-group
spring.kafka.consumer.auto-offset-reset=earliest

spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer

spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.trusted.packages=com.rePlikant.fraud_detection.event

spring.kafka.consumer.properties.spring.json.value.default.type=com.rePlikant.fraud_detection.event.TransactionEvent
spring.jpa.hibernate.ddl-auto=create